# QASkillKit 评测集（testcase-generator）
# 公开入口：无需 TAPD/数据库，clone 即跑。路径相对 evals/ 目录。
meta:
  name: testcase-generator-evalset
  version: 6   # v6：hallucination 维度定义与 CONTRACT_CAPS 对齐（bc-0007 治疗）——明确"规则通道检出 no_secrets 则本维度不高于 2"、收紧"示例/占位"例外（写"测试账号"再跟具体账号名+明文密码不算标注）、补 5-1 分阶梯与 reason 举证要求；评审约定 5 增加 hallucination ≤2 上限。规则通道与用例集本身未变，跨版本对比以规则通道为准
  # v5：裁判通道分工重划（bc-0005 治疗）——变更点清单由评测集给定并注入 judge prompt（新增 change_points 段）、规则通道检出的违规作为确定性事实注入（裁判不得推翻）、coverage 改评场景充分性与粒度（机械覆盖度归规则通道）、consistency 只评语义一致；规则通道与用例集本身未变，跨版本对比以规则通道为准
  # v4：Judge 评分标准收紧（coverage 改为逐变更点核对+分数上限、consistency 纳入输出契约、新增评审约定4/5），修 bc-0004；v4 首轮实跑验证未达标（裁判虚构核对结论），见 bc-0005
  # v3：评测集扩充至 12 条（3 正样本 + 9 负向对照，每规则一发单规则隔离弹）；v2 judge 标准修订见 bc-0001/0002；v1 原始报告见 reports/calibration-2026-11-12-before.*
  sut_prompt: prompts/testcase-generator.public.md
  judge:
    dimensions: [coverage, relevance, consistency, hallucination]
    scale: [1, 5]
    pass_threshold: 4   # judge 各维度均分 ≥ 4 才算过（1-5 分制）

# 变更点清单（ground truth，v5 新增）：按 fixture 路径给出，注入 judge prompt 让裁判核对**给定清单**
# 而不是自己从需求里拆——v4 实跑证明小模型会自己编清单和编核对结论（bc-0005）。
# 约束：每份清单的编号必须与该 fixture 下各 case 的 expected_change_points 完全一致（pytest 锁）；
# 内容取自登记正样本的「变更点说明」表，即评测集认定的参考答案口径。
change_points:
  fixtures/1000001-requirement.md:
    - '① 连续输错密码 5 次锁定该账号 30 分钟（计数按账号维度累计，成功登录后清零）'
    - '② 第 3 次输错起，错误提示展示剩余可尝试次数，文案"账号或密码错误，还可尝试 N 次"（N = 5 - 已错误次数）'
    - '③ 锁定期间即使输入正确密码也不放行，提示"账号已锁定，请 X 分钟后重试"（X 为剩余分钟数，向上取整）'
  fixtures/1000002-requirement.md:
    - '① 系统配置页新增"库存管理"分组（位于"订单管理"与"门店管理"分组之间）'
    - '② "库存管理"分组下新增"入库打码"配置项卡片（名称、描述文案、状态标签、操作按钮）'
    - '③ 配置弹窗 UI 与文案（标题"入库打码"、"是否开启"开关、使用说明文案、取消/保存按钮、右上角关闭）'
    - '④ 保存时校验租户库存批次功能（未开启报错"请先开通库存批次功能！"且弹窗不关闭；已开启保存成功）'
    - '⑤ 默认值规则（新建租户默认关闭；已有老租户升级后均设置为关闭）'
  fixtures/1020256-requirement.md:
    - '① 门店库存列表底部新增"库存总金额"统计（当前门店、已选条件下所有未删除商品库存金额之和，保留两位小数；翻页不变、随搜索与分类筛选联动）'
    - '② 列表"库存总金额"列改名为"库存金额"，列数据内容不变'
    - '③ "库存金额"列头帮助文案更新为"该商品当前在库部分的库存金额"'
    - '④ 导出 Excel 表头"库存总金额"同步改为"库存金额"；导出按钮防抖（快速重复点击仅触发一次导出任务）'
    - '⑤ 导出 Excel 数据末尾新增"库存金额合计"统计行（Excel 中库存金额列金额之和）'

cases:
  - id: tc-1000001-good
    kind: positive
    fixture: fixtures/1000001-requirement.md
    output: ../examples/sample-testcase.md
    expected_change_points: ["①", "②", "③"]

  - id: tc-1000002-good
    kind: positive
    fixture: fixtures/1000002-requirement.md
    output: ../demo/1000002-PC后台账户列表系统配置增加入库打码功能.md
    expected_change_points: ["①", "②", "③", "④", "⑤"]

  # 真实执行版正样本：实际结果列已回填（含 PASS/FAIL/未执行），验证评测器不惩罚执行期内容
  - id: tc-1020256-executed
    kind: positive
    fixture: fixtures/1020256-requirement.md
    output: ../workspace/testcases/sprint100/demo1.md
    expected_change_points: ["①", "②", "③", "④", "⑤"]

  # 负向对照：故意写坏的样本，评测器必须检出以下违规（判别力自测）
  - id: tc-1000001-negative
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/1000001-bad-output.md
    expected_change_points: ["①", "②", "③"]
    expect_violations:
      - priority_valid
      - no_jump_refs
      - expected_non_empty
      - format_columns
      - no_secrets
      - coverage

  # 单规则隔离负向对照（v3 扩充）：每份只坏一处，证明 8 条规则各自独立可检出，
  # 排除"混合样本里某规则搭便车才被触发"的可能。均基于虚构需求 1000001。
  - id: tc-neg-format
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-format.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [format_columns]

  - id: tc-neg-priority
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-priority.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [priority_valid]

  - id: tc-neg-traceability
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-traceability.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [traceability]

  - id: tc-neg-jump-refs
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-jump-refs.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [no_jump_refs]

  - id: tc-neg-expected-empty
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-expected-empty.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [expected_non_empty]

  - id: tc-neg-secrets
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-secrets.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [no_secrets]

  - id: tc-neg-change-section
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-change-section.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [change_section]

  - id: tc-neg-coverage
    kind: negative-control
    fixture: fixtures/1000001-requirement.md
    output: fixtures/neg-coverage.md
    expected_change_points: ["①", "②", "③"]
    expect_violations: [coverage]