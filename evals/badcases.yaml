  - id: bc-0007
    case_id: tc-neg-secrets（v5 三次实跑全复现：登记评测 220749、A 臂 221318、B 臂 221550）
    date: 2026-11-13
    dimension: hallucination（评分标准与一致率指标未对齐）
    phenomenon: >-
      v5 把规则通道结论注入 judge prompt 后，矛盾率从 v4 的 36%/54% 降到 7%/4%，
      但剩下这一条三次跑动全复现：规则通道检出"行1 前置条件含虚构凭证/内网地址"（no_secrets），
      裁判 hallucination 仍给 5 分、理由写"未虚构需求中不存在的事实"。
      比对 DIM_DEFS 与 CONTRACT_CAPS 后定位：指标侧定了 no_secrets → hallucination ≤2，
      但维度定义既没写"以规则通道结论为准"，还留了"明确标注为示例/占位的测试账号不算虚构"的例外，
      而该样本前置条件写的正是"使用测试账号 + 具体账号名 + 明文密码"（见 fixtures/neg-secrets.md 行1），
      裁判顺着例外条款把它放过了。即不是模型乱来，是评分标准的例外口径太宽、与指标没对齐。
    root_cause: evalset
    suggested_by: AI 分析（v5 三份带 Judge 报告的 --judge-agreement 明细 + DIM_DEFS/CONTRACT_CAPS 逐条比对）
    confirmed_by: WL2O2O（2026-11-18，认可 evalset 归因与「已修复」判定）
    status: fixed
    fix_ref: >-
      评测集 v5 → v6（2026-11-13，根因待确认）：hallucination 定义改为"先看规则通道有没有 no_secrets，
      有则本维度不得高于 2、reason 必须承认该行事实（写未虚构即不合格理由）"；例外收紧为
      "值本身带占位标记（尖括号占位符/示例/待补充/XXX/脱敏）"，并明文写"写测试账号再跟具体账号名 + 明文密码
      不算标注，一律按虚构计"；补 5-1 分阶梯与举证要求；评审约定 5 增加"列出 no_secrets 时
      hallucination 不得给 3 分以上"。验证待办（需 key，未跑不得声称已生效）：跑 `python3 evals/evaluate.py`
      后用 `--judge-agreement` 核对，验收标准「tc-neg-secrets 的 hallucination 矛盾归零、
      总矛盾率不高于 v5 的 7%，且正样本 hallucination 不因新定义虚降」。
      实跑结果（2026-11-13，reports/baseline-2026-11-13-233955.*，export key）：三条全部达标——
      tc-neg-secrets 的 hallucination 5 → 2 且理由如实承认虚构凭证；总矛盾率仍 7%（1/14）但换了对象
      （见 bc-0008）；正样本 hallucination 仍 5/5/5、四维均分 4.75/4.75/4.25 未虚降。
      v7 续航（reports/baseline-2026-11-14-075449.*）与 v8 两版（160734、161427）里 tc-neg-secrets 的
      hallucination 三轮都 ≤2，说明治好的口径没被后续改动放回去。
      根因（evalset，评分标准的例外口径过宽、与一致率指标没对齐）与「已修复」判定已于 2026-11-18
      由 WL2O2O 签字成立，**本条标 fixed**。人工抽样复批仍未做（calibration.yaml 待补），
      那属于"裁判可信度"，不影响本条"口径已修好"的结论。
  - id: bc-0008
    case_id: tc-neg-format（v6 实跑 reports/baseline-2026-11-13-233955.*）
    date: 2026-11-13
    dimension: consistency（裁判绕过降分上限）
    phenomenon: >-
      v6 治好 bc-0007 后，登记评测矛盾率仍是 7%（1/14），换成了这一条：
      规则通道检出"行3 列数8≠9"（format_columns，映射 consistency ≤3），
      裁判 consistency 给 4 分，理由写"用例自身前后一致且可独立执行，但存在列数错误，
      这是格式问题而非内容不一致"。即裁判承认了事实、但用"格式问题不算内容不一致"
      把上限绕过去了——v4 那轮是 outright 否认事实（写"优先级使用 P0/P1/P2"），
      这轮是承认事实后重新定义口径，属同一类"上限不被执行"的新变种。
    root_cause: evalset
    suggested_by: AI 分析（--judge-agreement 明细 + 裁判 reason 原文）
    confirmed_by: WL2O2O（2026-11-18，认可 evalset 归因与「已修复」判定）
    status: fixed
    fix_ref: >-
      修法（属评分标准调整，已走三件套：升版本 + 重跑基线 + 复跑验证）：
      在 consistency 定义里明写"列结构/优先级/跳转引用等契约项属内容契约的一部分，
      不得以'这是格式问题不是内容问题'为由免于降分；规则通道列出契约违规时本维度不得高于 3"。
      实测补充（2026-11-14，--runs 3）：该条 consistency 三轮为 3~4，只有给 4 分那轮绕过上限，
      即逃逸不是每轮都发生——单跑可能碰不到，重复评才看得见。
      验收标准：v7 复跑后该条矛盾归零、`--runs 3` 下 consistency 不再出现 4 分，且总矛盾率低于 7%，
      正样本 consistency 不虚降。
      v7 实跑结果（reports/baseline-2026-11-14-075449.*，export key + `--runs 3`）：
      四条验收全部达标——tc-neg-format 的 consistency 三轮恒 3 分（不再出现 4）、
      总矛盾率 7% → **0%**（0/14，十二份带裁判报告里的第一份零矛盾）、
      正样本 consistency 三轮最低仍 4 分（未虚降）；且 `CONTRACT_CAPS` 与判定逻辑一个字没改，
      说明是裁判开始守规矩、不是指标被调松（测试锚点 test_v7_report_is_the_first_zero_contradiction_run）。
      根因归类与「已修复」判定已由 WL2O2O 于 2026-11-18 确认。
      遗留边界：矛盾率归零不等于裁判可信——同轮反向可疑仍有 1 项（见 bc-0009），
      且这批分数的人工抽样复批尚未逐项完成，calibration.yaml 待补。
  - id: bc-0009
