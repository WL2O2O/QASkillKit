      属评分标准口径问题而非模型随机性；该轮反向可疑 4 项、矛盾率仍 7%（1/14，见 bc-0008）。
    root_cause: evalset
    suggested_by: AI 分析（--judge-agreement 反向可疑明细 + fixtures/neg-priority.md、fixtures/neg-traceability.md 复读）
