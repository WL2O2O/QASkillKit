# Judge-人工一致率校准记录（人工复批后才算数）
# 每次校准追加一条；样本量小须注明局限，评测集扩充后继续抽样。
schema:
  fields: [id, date, judge_model, mode, sample_size, agreed, agreement, reviewer, scope, note]
entries:
  - id: cal-0001
    date: 2026-11-12
    judge_model: glm-4-flash
    mode: offline+judge
    sample_size: 8          # 2 份正样本 × 4 维度
    agreed: 8
    agreement: 1.0
    reviewer: WL2O2O（人工逐条复批）
    scope: baseline-2026-11-12 复评（rubric 修复后全 5 分那次，见 bc-0001/0002）
    note: >-
      样本量小，一致率仅代表本批；评测集扩充后需继续抽样校准。
      升 v2 后复跑：7/8 分数不变，tc-1000001-good 覆盖度 5→4（运行间 ±1 抖动），
      两份结论仍 pass；最终基线均分 4.8/5.0。
  - id: cal-0002
    date: 2026-11-18
    judge_model: glm-4-flash
    mode: offline+judge（--runs 3，A 组取第 1 轮分数；B 组三轮全列）
    sample_size: 21        # v7 全量：3 份正样本 × 4 维度 + 3 条负向对照的 hallucination × 3 轮
    agreed: 17
    agreement: 0.8095238
    reviewer: WL2O2O（人工抽检 5 项后认可 AI 复核结论；21 项逐条判定由 AI 跨模型复核产出）
    scope: >-
      baseline-2026-11-14-075449（v7）的 21 个分数；抽检项 A11/B1/B5/B6 + 任取 1 项正样本
    note: >-
      这是一条"AI 复核 + 人工抽检背书"的记录，不是 21 项人工逐条复批：本人抽检的 5 项全部认可，
      其余 16 项只审阅了结论（逐条判定与证据见 evals/reviews/v7-ai-review.md）。
      17/21 的含义是"AI 复核对裁判分数的判定"，对外引用须注明"AI 复核、人工抽检背书"，
      不能说成纯人工一致率。抽检的 4 项恰是裁判错误的争议项（A11/B1/B5/B6），
      该子集的 judge-人工一致仅 1/5——定向抽样不可外推，不能拿它估整体。
      严格级（理由也必须站得住）为 14/21：A5/A9/A1 三处理由编造或误报，分值本身站得住。
  - id: cal-0003
    date: 2026-11-18
    judge_model: glm-4-flash
    mode: offline+judge（--runs 3，取第 1 轮分数）
    sample_size: 14        # 3 份正样本 × 4 维度 + 2 条负向对照各 1 个争议维度
    agreed: 12
    agreement: 0.8571429
    reviewer: WL2O2O（本人在对话中逐项复批，非抽检背书）
    scope: >-
      baseline-2026-11-18-161427（v8）第 1 轮：tc-1000001-good / tc-1000002-good /
      tc-1020256-executed 各 4 维，加 tc-neg-priority 的 consistency、tc-neg-change-section 的 coverage
    note: >-
      分数级 12/14：两条负向对照的分值被判错——tc-neg-priority consistency 4（规则 priority_valid
      报 P5 非法，上限 ≤3）、tc-neg-change-section coverage 4（规则 change_section 报缺章节，上限 ≤3），
      两处理由都自己承认了事实却没降分，本人判定应 ≤3。
      严格级（理由也必须站得住）只有 8/14：另有四处分值被认可但举证站不住——
      tc-1020256-executed 称"列数与表头差异"（19 行全 9 列，规则无 format_columns 告警，
      实为第 50 行记录的产品缺陷，bc-0011）、tc-1000002-good 称"库存批次未开启分支未描述"
      （第 66 行正是该用例，bc-0010）、tc-1000001-good 称"①缺锁定期间登录"（第 33 行即该用例）、
      tc-1020256-executed coverage 称"防抖用例未覆盖快速重复点击"（第 59 行即该用例）。
      含义：v8 的 0% 反向可疑是靠"放宽到不判错"，代价是"判对时也常编理由"；
      负向对照的 judge 分数不承担判别力（判别力看规则通道 detected），别拿这 2 条估整体。
      定向抽样（先挑争议项）不可外推；其余十三份带 Judge 报告仍未复批。
  - id: cal-0004
    date: 2026-11-18
    judge_model: glm-4-flash
    mode: offline（对存档报告逐条判定，未新跑裁判；--runs 3 的取第 1 轮分数）
    sample_size: 212       # 十三份报告里有规则证据、可判定的分数（总分数 584，其余 372 个无规则证据不判）
    agreed: 171
    agreement: 0.8066038
    reviewer: WL2O2O（2026-11-18 授权按其判定口径代批；212 项逐条判定由 AI 执行，本人未逐项阅读）
    scope: >-
      其余十三份带 Judge 分数的报告：v2 baseline-2026-11-12（6）、v3 092720（14）/093523（23）、
      v4 165241（14）/170553（14）/170848（28）、v5 220749（14）/221318（15）/221550（28）、
      v6 233955（14）/001756（14）、v8 155846（14）/160734（14）
    note: >-
      这是一条"授权 + 口径代批"记录，不是人工逐项复批：判定口径沿用本人在 cal-0003 的选择——
      有规则证据且未超上限即认可，超上限或与规则事实相反即不认可，举证编造记严格级失败。
      分数级 171/212（80.7%）：41 个分值不认可（判坏输出给高分 / 判好输出扣分），集中在 v3/v4 两代
      （093523 一篇就 11 个、170848 9 个），与 bc-0004/bc-0005 的结论一致；v8 的 160734 仅 1 个、155846 0 个。
      严格级 146/212（68.9%）：另扣 17 项反向可疑（无规则证据却压分，v6 拿"账号 A"当虚构的 4 项、
      v8 155846 的 2 项都在内）与 8 处编造举证（理由称"列数错误/列结构不一致/存在跳转引用"，
      规则通道无对应违规：165241、233955、155846×3、160734 的 tc-1020256-executed，
      155846 的 tc-neg-secrets / tc-neg-change-section，220749 的 tc-neg-traceability / tc-neg-coverage）。
      可复现性：逐条明细与逐份统计见 `reviews/corpus-audit-2026-11-18.md`；41 个不认可与 17 项反向可疑
      可用 `--judge-agreement` 对同名报告离线重算；8 处编造举证是逐条读 reason 与 fixture 得出的，
      报告 json 里的 reason 原文可逐条核对。
      局限（必须连带引用）：① 这不是人工阅读，212 项之外还有 372 个分数没有规则证据，AI 不判；
      ② 早期 v2/v3 报告的上限映射按当前 CONTRACT_CAPS 离线重算，只作体检，不等于当时裁判违约；
      ③ 与 cal-0001/0003（人工逐项）和 cal-0002（人工抽检背书）不可混算成一个"judge-人工一致率"。
